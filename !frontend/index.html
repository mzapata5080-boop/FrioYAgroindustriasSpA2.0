<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frío y Agroindustria SpA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=ui-v3">
  <script src="config.js"></script>
  <script src="dashboard.js?v=ui-v3" defer></script>
  <script src="forms.js?v=comercial-1" defer></script>
  <script src="comercial.js?v=1" defer></script>
  <script src="app.js?v=ui-v3" defer></script>
  <script src="operaciones.js?v=1" defer></script>
</head>
<body>
  <nav class="site-navbar" aria-label="Navegación principal">
    <div class="site-container navbar-content">
      <button id="sidebar-toggle" class="btn btn-outline-light sidebar-toggle" type="button" aria-expanded="true" aria-controls="app-sidebar" aria-label="Contraer menú" hidden>
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <a id="home" class="site-brand" href="#">Frío y Agroindustria SpA</a>
      <div class="session-actions">
        <span id="identity"></span>
        <div id="alerts-menu" class="alerts-menu" hidden>
          <button id="alerts-toggle" class="btn btn-outline-light alerts-toggle" type="button" aria-expanded="false" aria-controls="alerts-panel" aria-label="Alertas">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <span id="alert-count" class="alert-counter" hidden>0</span>
          </button>
          <section id="alerts-panel" class="alerts-panel" hidden aria-label="Alertas internas">
            <h2 class="h6">Alertas internas</h2>
            <div id="alert-groups"></div>
          </section>
        </div>
        <button id="logout" class="btn btn-outline-light" hidden>Cerrar Sesión</button>
      </div>
    </div>
  </nav>
  <main class="site-container main-content">
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="login-panel" class="card login-card">
      <h1 class="h3">Iniciar sesión</h1>
      <form id="login-form">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" class="form-control mb-3" autocomplete="username" required>
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
        <button class="btn btn-primary">Ingresar</button>
      </form>
    </section>
    <section id="workspace" hidden>
      <div id="app-shell" class="app-shell">
        <aside id="app-sidebar" class="app-sidebar" aria-label="Menú de módulos">
          <div class="sidebar-heading">NAVEGACIÓN</div>
          <nav id="modules" class="sidebar-nav" aria-label="Módulos"></nav>
        </aside>
        <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Cerrar menú"></button>
        <div class="workspace-main">
          <section id="dashboard" aria-label="Panel de control">
            <div class="card welcome-card">
              <h1 id="welcome">Bienvenido,</h1>
              <p>Panel de control (Sprint 1). Sus funciones están habilitadas según su rol en la empresa.</p>
            </div>
            <section id="manager-dashboard" class="manager-dashboard" hidden aria-label="Dashboard de gerencia"></section>
            <div id="role-cards" class="role-grid"></div>
            <section class="card warehouse-card" aria-labelledby="warehouse-title">
              <h2 id="warehouse-title">Bodega</h2>
              <div id="warehouse-actions" class="warehouse-actions"></div>
            </section>
            <details id="additional-modules" class="card additional-modules" hidden>
              <summary>Gestión comercial</summary>
              <div id="additional-actions" class="warehouse-actions"></div>
            </details>
          </section>
          <section id="module-view" hidden>
            <div class="module-navigation">
              <button id="back" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Volver al panel</button>
            </div>
            <div class="card records-card">
              <div class="records-heading">
                <h1 class="h3" id="section-title">Selecciona un módulo</h1>
                <button id="new" class="btn btn-success" hidden>Nuevo registro</button>
              </div>
              <div id="records" class="table-responsive mt-3"></div>
            </div>
            <section id="editor" class="card editor-card" hidden>
              <h2 class="h4" id="editor-title"></h2>
              <form id="edit-form"></form>
            </section>
          </section>
        </div>
      </div>
    </section>
  </main>
  <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="global-loading" class="global-loading" hidden aria-hidden="true">
    <div class="loading-card" role="status">
      <span class="spinner-border text-primary" aria-hidden="true"></span>
      <span>Cargando...</span>
    </div>
  </div>
</body>
</html>
